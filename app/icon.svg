  <circle cx="200" cy="200" r="150" fill="#FFFDF8" stroke="#2E2A72" stroke-width="4"/>

  <!-- base letters -->
  <text x="80" y="273" font-family="Baloo 2" font-weight="800" font-size="205" fill="#5B4FE0">M</text>
  <text x="177" y="273" font-family="Baloo 2" font-weight="800" font-size="205" fill="#F2B705">N</text>
  <text x="80" y="273" font-family="Baloo 2" font-weight="800" font-size="205" fill="#2E2A72" clip-path="url(#clipN)">M</text>

  <!-- bee sitting IN the letters -->
  <g transform="translate(200 218) rotate(-10) scale(0.95)">
    <ellipse cx="6" cy="-16" rx="16" ry="10" fill="#F2E9DA" opacity="0.92" stroke="#2E2A72" stroke-width="2" transform="rotate(-18 6 -16)"/>
    <ellipse cx="14" cy="-10" rx="14" ry="9" fill="#F2E9DA" opacity="0.92" stroke="#2E2A72" stroke-width="2" transform="rotate(8 14 -10)"/>
    <ellipse cx="0" cy="0" rx="23" ry="15" fill="#F2B705" stroke="#2E2A72" stroke-width="2.5"/>
    <g clip-path="url(#beeBody)">
      <rect x="-6" y="-16" width="7" height="32" fill="#2E2A72"/>
      <rect x="9" y="-16" width="7" height="32" fill="#2E2A72"/>
    </g>
    <ellipse cx="0" cy="0" rx="23" ry="15" fill="none" stroke="#2E2A72" stroke-width="2.5"/>
    <circle cx="-21" cy="-1" r="8.5" fill="#2E2A72"/>
    <path d="M -26 -8 Q -31 -15 -27 -18" fill="none" stroke="#2E2A72" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -22 -9 Q -24 -17 -18 -19" fill="none" stroke="#2E2A72" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- letter stroke re-drawn ONLY where it should weave IN FRONT of the bee (intersection of M/N crossing shape and a band across the bee body) -->
  <g clip-path="url(#clipN)">
    <g clip-path="url(#beeBand)">
      <text x="80" y="273" font-family="Baloo 2" font-weight="800" font-size="205" fill="#2E2A72">M</text>
    </g>
