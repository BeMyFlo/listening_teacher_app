<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student – IELTS with Ms Nhi</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <script src="assets/icons.js"></script>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebarRoot"></aside>
    <div class="main-area">
      <header class="topbar-v2" id="topbarRoot"></header>

      <main class="content">

        <!-- Lessons (Phase 3) -->
        <section id="step-lessons" style="display:none;">
          <div class="page-head">
            <div class="head-left">
              <div class="page-head-icon"><svg class="icon"><use href="#icon-book-open"></use></svg></div>
              <div>
                <h1>Lessons</h1>
                <p class="page-sub">Units by level — Grammar, Vocabulary, Listening, Reading, Writing, Speaking</p>
              </div>
            </div>
          </div>

          <div id="lessonsList">
            <div class="card">
              <div id="unitsStatus" class="notice info">Loading lesson units...</div>
              <div id="unitsList"></div>
            </div>
          </div>

          <div id="lessonsDetail" style="display:none;">
            <div class="card">
              <p class="back-link" id="backToUnitsList"><svg class="icon"><use href="#icon-arrow-left"></use></svg> Back to lesson list</p>
              <h2 id="lessonUnitTitle"></h2>
              <div class="unit-cat-tabs" id="lessonCatTabs"></div>
              <div id="lessonCatContent"></div>
            </div>
          </div>
        </section>

        <!-- STEP: Mock test list (full 4-skill exams, locked until opensAt) -->
        <section id="step-picker" style="display:none;">
          <div class="page-head">
            <div class="head-left">
              <div class="page-head-icon"><svg class="icon"><use href="#icon-clipboard"></use></svg></div>
              <div>
                <h1>Mock Tests</h1>
                <p class="page-sub">Full 4-skill mock exams — Listening, Reading, Writing, Speaking</p>
              </div>
            </div>
          </div>
          <div class="stat-card-grid" id="studentStatGrid" style="display:none;"></div>
          <div class="card">
            <div id="testStatus" class="notice info">Loading test list...</div>
            <div id="testList"></div>
          </div>
        </section>

        <!-- STEP: Take test -->
        <section id="step-test" style="display:none;">
          <div class="card">
            <p class="back-link" id="backToPickerFromTest"><svg class="icon"><use href="#icon-arrow-left"></use></svg> Back to test list</p>
            <div class="test-timer" id="testTimer" style="display:none;"></div>
            <span class="badge test" id="testSubjectBadge">Mock Test</span>
            <h2 id="testTitle"></h2>
            <p id="testInstructions" style="color:var(--muted); margin-bottom: 20px;"></p>

            <div id="testForm"></div>

            <button class="btn" id="btnSubmitTest" style="margin-top:20px;">Submit Test</button>
          </div>
        </section>

        <!-- STEP: Test Results -->
        <section id="step-result" style="display:none;">
          <div class="card">
            <div class="score-box">
              <div style="color:var(--muted); font-weight:600;" id="resultTitle"></div>
              <div class="big"><span id="scoreValue">0</span><span> / <span id="scoreTotal">10</span></span></div>
              <p id="submitStatus" class="notice info" style="display:inline-block;"></p>
            </div>
            <div id="resultDetail"></div>
            <div style="text-align:center; margin-top:20px;">
              <button class="btn secondary" id="btnRetake">Retake Test</button>
              <button class="btn" id="btnBackList">Back to Test List</button>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/student.js"></script>
</body>
</html>
