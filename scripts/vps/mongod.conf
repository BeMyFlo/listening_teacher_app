# Cấu hình MongoDB cho VPS — chép vào /etc/mongod.conf (xem README.md).
storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      # VPS chạy chung Next.js + chat: giới hạn bộ nhớ đệm của MongoDB.
      # Dữ liệu hiện chỉ vài MB, 0.5 GB là dư. VPS riêng cho DB thì bỏ dòng này.
      cacheSizeGB: 0.5

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # CHỈ nghe trong máy. Không bao giờ đổi thành 0.0.0.0 — MongoDB lộ ra
  # Internet là kiểu bị xoá sạch dữ liệu + đòi tiền chuộc phổ biến nhất.
  bindIp: 127.0.0.1

security:
  authorization: enabled

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
